name: Weekly Data Sync
on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 3 AM UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: cd sync && npm install
      - name: Run sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Optional: without it the Next Phase steps fail and the run warns
          # rather than failing, but no city/state arrives and every genuinely
          # new program is rejected for having no state.
          NEXTPHASE_TOKEN: ${{ secrets.NEXTPHASE_TOKEN }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          node sync/sync.js --skip-contacts --diff-contacts
