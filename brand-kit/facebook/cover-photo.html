<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1640px;
      height: 624px;
      background: #0A1F44;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      align-items: center;
      gap: 80px;
    }
    .icon {
      flex-shrink: 0;
    }
    .icon svg {
      width: 320px;
      height: 320px;
    }
    .text {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 84px;
      color: #FFFFFF;
      letter-spacing: 4px;
      line-height: 1.1;
    }
    .tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 44px;
      color: #00FF00;
      letter-spacing: 2px;
      font-style: italic;
    }
    .url {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 2px;
      margin-top: 8px;
    }
    /* Subtle decorative lines */
    .accent-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #00FF00;
    }
    .accent-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #00FF00;
    }
  </style>
</head>
<body>
  <div class="accent-top"></div>
  <div class="accent-bottom"></div>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250" width="280" height="250">
        <rect x="37" y="15" width="206" height="220" rx="22" fill="rgba(255,255,255,0.1)"/>
        <rect x="108" y="35" width="8" height="177" fill="#FFFFFF"/>
        <rect x="164" y="35" width="8" height="177" fill="#FFFFFF"/>
        <rect x="98" y="165" width="84" height="8" fill="#FFFFFF"/>
        <rect x="70" y="215" width="140" height="5" fill="#00FF00"/>
      </svg>
    </div>
    <div class="text">
      <div class="title">COLLEGE RUGBY<br>PORTAL</div>
      <div class="tagline">Explore. Connect. Play.</div>
      <div class="url">collegerugbyportal.com</div>
    </div>
  </div>
</body>
</html>
