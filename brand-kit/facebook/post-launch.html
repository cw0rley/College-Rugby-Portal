<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0A1F44;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    /* Subtle field lines */
    .field-line-1 {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: rgba(255, 255, 255, 0.04);
    }
    .field-line-2 {
      position: absolute;
      top: 0;
      left: 25%;
      width: 1px;
      height: 100%;
      background: rgba(255, 255, 255, 0.03);
    }
    .field-line-3 {
      position: absolute;
      top: 0;
      left: 75%;
      width: 1px;
      height: 100%;
      background: rgba(255, 255, 255, 0.03);
    }
    .accent-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: #00FF00;
    }
    .accent-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: #00FF00;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      z-index: 1;
    }
    .icon svg {
      width: 180px;
      height: 180px;
    }
    .title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 64px;
      color: #FFFFFF;
      letter-spacing: 4px;
      text-align: center;
      line-height: 1.15;
    }
    .tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: #00FF00;
      letter-spacing: 2px;
      font-style: italic;
      text-align: center;
    }
    .stat {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 22px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      letter-spacing: 1px;
    }
    .url {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="accent-top"></div>
  <div class="accent-bottom"></div>
  <div class="field-line-1"></div>
  <div class="field-line-2"></div>
  <div class="field-line-3"></div>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 250">
        <rect x="37" y="15" width="206" height="220" rx="22" fill="rgba(255,255,255,0.08)"/>
        <rect x="108" y="35" width="8" height="177" fill="#FFFFFF"/>
        <rect x="164" y="35" width="8" height="177" fill="#FFFFFF"/>
        <rect x="98" y="165" width="84" height="8" fill="#FFFFFF"/>
        <rect x="70" y="215" width="140" height="5" fill="#00FF00"/>
      </svg>
    </div>
    <div class="title">COLLEGE RUGBY PORTAL</div>
    <div class="stat">900+ Men's & Women's Programs Across the US</div>
    <div class="tagline">Explore. Connect. Play.</div>
    <div class="url">collegerugbyportal.com</div>
  </div>
</body>
</html>
