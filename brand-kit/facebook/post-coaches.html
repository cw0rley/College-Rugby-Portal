<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0A1F44;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .field-line-1 { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(255,255,255,0.04); }
    .field-line-2 { position: absolute; top: 0; left: 25%; width: 1px; height: 100%; background: rgba(255,255,255,0.03); }
    .field-line-3 { position: absolute; top: 0; left: 75%; width: 1px; height: 100%; background: rgba(255,255,255,0.03); }
    .accent-top { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #00FF00; }
    .accent-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #00FF00; }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      z-index: 1;
      max-width: 900px;
    }
    .heading {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 56px;
      color: #FFFFFF;
      letter-spacing: 3px;
      text-align: center;
      line-height: 1.15;
    }
    .heading span { color: #00FF00; }
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 24px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      line-height: 1.5;
      max-width: 700px;
    }
    .cta {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #0A1F44;
      background: #00FF00;
      padding: 14px 40px;
      border-radius: 6px;
      letter-spacing: 1px;
    }
    .url {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="accent-top"></div>
  <div class="accent-bottom"></div>
  <div class="field-line-1"></div>
  <div class="field-line-2"></div>
  <div class="field-line-3"></div>
  <div class="container">
    <div class="heading">COACHES:<br><span>RECRUITS</span> ARE LOOKING<br>FOR YOUR PROGRAM</div>
    <div class="subtitle">Players are searching College Rugby Portal right now. Make sure your program info and contact details are up to date.</div>
    <div class="cta">UPDATE YOUR LISTING</div>
    <div class="url">collegerugbyportal.com</div>
  </div>
</body>
</html>
